name: Publish programs

# Ручной запуск: Actions -> Publish programs -> Run workflow.
# Генератор разбирает MKPro/readable и коммитит результат в programs/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать эмулятор
        uses: actions/checkout@v4
        with:
          path: app

      - name: Забрать MKPro
        uses: actions/checkout@v4
        with:
          repository: greagre/MKPro
          path: .src-MKPro

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверить источник
        run: |
          test -d "$GITHUB_WORKSPACE/.src-MKPro/readable" \
            && echo "Источник на месте" \
            || (echo "Нет папки .src-MKPro/readable" && exit 1)

      - name: Разобрать программы
        working-directory: app
        env:
          MKPRO_DIR: ${{ github.workspace }}/.src-MKPro/readable
        run: node publish.cjs

      - name: Показать итог
        working-directory: app
        run: |
          node -e "const c=require('./programs/_catalog.json');console.log('всего '+c.total+', готово '+c.ready+', не разобрано '+c.unresolved)"

      - name: Закоммитить программы
        working-directory: app
        run: |
          git config user.name "programs-bot"
          git config user.email "programs-bot@users.noreply.github.com"
          git add programs
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "programs: каталог обновлён генератором"
            git push
          fi
