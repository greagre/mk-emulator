name: Publish programs

on:
  workflow_dispatch:
  push:
    paths:
      - 'publish.cjs'
      - '.github/workflows/publish.yml'

permissions:
  contents: write

concurrency:
  group: publish-programs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать эмулятор
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          persist-credentials: true

      - name: Забрать MKPro
        uses: actions/checkout@v4
        with:
          repository: greagre/MKPro
          path: .src-MKPro

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверить источник
        run: |
          echo "Источник: $GITHUB_WORKSPACE/.src-MKPro"
          ls -la "$GITHUB_WORKSPACE/.src-MKPro" | head -30
          if [ ! -d "$GITHUB_WORKSPACE/.src-MKPro/games" ]; then
            echo "::error::В MKPro нет папки games"
            exit 1
          fi
          echo "Листингов в games: $(find "$GITHUB_WORKSPACE/.src-MKPro/games" -name '*.txt' | wc -l)"
          if [ -d "$GITHUB_WORKSPACE/.src-MKPro/readable" ]; then
            echo "Листингов в readable: $(find "$GITHUB_WORKSPACE/.src-MKPro/readable" -name '*.txt' | wc -l)"
          fi

      - name: Подложить источник на оба известных пути
        working-directory: app
        run: |
          mkdir -p MKPro
          ln -sfn "$GITHUB_WORKSPACE/.src-MKPro/games" MKPro/games
          if [ -d "$GITHUB_WORKSPACE/.src-MKPro/readable" ]; then
            ln -sfn "$GITHUB_WORKSPACE/.src-MKPro/readable" MKPro/readable
          fi
          ls -la MKPro

      - name: Разобрать программы
        working-directory: app
        env:
          MKPRO_GAMES: ${{ github.workspace }}/.src-MKPro/games
          MKPRO_DIR: ${{ github.workspace }}/.src-MKPro/games
        run: node publish.cjs

      - name: Итог разбора
        if: always()
        working-directory: app
        run: |
          if [ -f programs/_catalog.json ]; then
            node -e "const c=require('./programs/_catalog.json');console.log('всего:',c.total,'| готово:',c.ready,'| не разобрано:',c.unresolved);if(c.byModel)console.log('по моделям:',JSON.stringify(c.byModel));"
          else
            echo "::error::_catalog.json не создан"
            exit 1
          fi

      - name: Закоммитить программы
        working-directory: app
        run: |
          git config user.name "programs-bot"
          git config user.email "programs-bot@users.noreply.github.com"
          rm -f MKPro/games MKPro/readable
          git add programs
          if git diff --staged --quiet; then
            echo "Изменений нет — каталог уже актуален"
            exit 0
          fi
          git commit -m "programs: пересборка каталога (publish.cjs v3)"
          git pull --rebase origin main
          git push origin HEAD:main
