name: Publish programs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать эмулятор
        uses: actions/checkout@v4
        with:
          path: app

      - name: Забрать MKPro
        uses: actions/checkout@v4
        with:
          repository: greagre/MKPro
          path: app/.src-MKPro

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверить источник
        working-directory: app
        run: |
          test -d .src-MKPro/games || { echo "Нет папки .src-MKPro/games"; exit 1; }
          echo "Файлов листингов: $(find .src-MKPro/games -name '*.txt' | wc -l)"

      - name: Собрать программы
        working-directory: app
        env:
          MKPRO_GAMES: ${{ github.workspace }}/app/.src-MKPro/games
        run: node publish.cjs

      - name: Итог в Job Summary
        working-directory: app
        run: |
          node -e "const c=require('./programs/_catalog.json');console.log('всего '+c.total+', готово '+c.ready+' (Б3-34 '+c.byModel['b3-34']+', МК-61 '+c.byModel.mk61+'), не разобрано '+c.unresolved)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Закоммитить программы
        working-directory: app
        run: |
          git config user.name "programs-bot"
          git config user.email "programs-bot@users.noreply.github.com"
          git add programs
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "programs: пересобрано из MKPro/games (publish.cjs rev3)"
            git push
          fi
