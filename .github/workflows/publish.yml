name: Publish programs

on:
  workflow_dispatch:
    inputs:
      src:
        description: 'Путь к каталогу readable (по умолчанию ../MKPro/readable)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mk-emulator
        uses: actions/checkout@v4

      - name: Checkout MKPro (источник листингов)
        uses: actions/checkout@v4
        with:
          repository: greagre/MKPro
          path: .src-MKPro
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish
        run: |
          SRC="${{ github.event.inputs.src }}"
          if [ -z "$SRC" ]; then SRC="$GITHUB_WORKSPACE/.src-MKPro/readable"; fi
          echo "Источник: $SRC"
          node publish.cjs --src "$SRC" --out ./programs

      - name: Summary
        run: |
          node -e "
            const c=require('./programs/_catalog.json');
            let s='## Публикация программ\n\n';
            s+='| Показатель | Значение |\n|:---|---:|\n';
            s+='| Всего файлов | '+c.total+' |\n';
            s+='| Готово | '+c.ready+' |\n';
            s+='| Не разобрано | '+c.unresolved+' |\n';
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,s);
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: programs
          path: programs/
