<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f23">
<title>ЭЛЕКТРОНИКА Б3-34 — эмулятор</title>
<style>
  :root {
    --bg: #15181b;
    --case: #2b2f34;
    --case-2: #23272b;
    --key: #3a4046;
    --key-2: #444b52;
    --dark: #31373d;
    --blue: #2f5f8f;
    --red: #8c3b3b;
    --lcd: #b7c3a4;
    --lcd-ink: #22291c;
    --line: #3d444b;
    --text: #e6e9ec;
    --muted: #9aa4ad;
    --accent: #6fb3ef;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: 12px 10px 28px; }
  .app { max-width: 520px; margin: 0 auto; }

  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .top label { font-size: 12px; color: var(--muted); }
  select {
    flex: 1; background: var(--case-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 10px; font-size: 14px;
  }

  .calc {
    background: linear-gradient(180deg, var(--case), var(--case-2));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px 12px 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }

  .brand { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
  .brand #modelName { color: var(--accent); letter-spacing: 1px; font-weight: 700; }

  .screen {
    background: #0f1214; border-radius: 12px; padding: 8px;
    border: 1px solid #0a0c0e; box-shadow: inset 0 2px 10px rgba(0,0,0,.7);
  }
  .lcd {
    background: var(--lcd); color: var(--lcd-ink);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(28px, 10vw, 40px);
    line-height: 1.2;
    text-align: right;
    padding: 6px 10px;
    min-height: 54px;
    overflow: hidden;
    white-space: nowrap;
    letter-spacing: 1px;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .lcd.err { color: #7d1d1d; }
  .lcd-sub { display: flex; justify-content: space-between; margin-top: 6px;
    font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .lcd-sub b { color: var(--text); font-weight: 600; }

  .stack { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 10px 0 8px; }
  .cell {
    background: #1b1f23; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 4px; text-align: center; min-width: 0;
  }
  .cell b { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
  .cell span { display: block; font-size: 12px; font-family: ui-monospace, Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; }
  .cell.cur { border-color: var(--accent); }
  .cell.cur span { color: var(--accent); }

  .regs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px; }
  .reg {
    background: #1b1f23; border: 1px solid var(--line); border-radius: 7px;
    color: var(--muted); padding: 4px 2px; font: inherit; cursor: default;
    display: flex; flex-direction: column; align-items: center; min-width: 0;
  }
  .reg b { font-size: 10px; font-weight: 700; }
  .reg span { font-size: 10px; font-family: ui-monospace, Menlo, monospace;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reg.pick { cursor: pointer; border-color: var(--accent); color: var(--text); }
  .reg.pick:active { background: #24405a; }

  .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .key {
    aspect-ratio: 1 / 1;
    border: 1px solid #191c20;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--key-2), var(--key));
    color: var(--text);
    font-size: clamp(12px, 3.6vw, 16px);
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 2px 0 #171a1d, inset 0 1px 0 rgba(255,255,255,.08);
    transition: transform .04s ease, filter .12s ease;
    padding: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .key:active { transform: translateY(2px); box-shadow: 0 0 0 #171a1d, inset 0 1px 0 rgba(255,255,255,.05); filter: brightness(1.15); }
  .key.blue { background: linear-gradient(180deg, #3a6f9f, var(--blue)); }
  .key.red { background: linear-gradient(180deg, #a04848, var(--red)); }
  .key.dark { background: linear-gradient(180deg, #3d444b, var(--dark)); }
  .key.pref { background: linear-gradient(180deg, #4a5259, #363c42); color: var(--accent); }
  .key.on { outline: 2px solid var(--accent); outline-offset: -2px; }

  .service { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .service button {
    background: #1f242a; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 6px; font-size: 12px; font-family: inherit; cursor: pointer;
  }
  .service button:active { background: #2b3641; }

  .hint {
    margin-top: 10px; min-height: 34px;
    background: #12161a; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 12px; color: var(--muted); line-height: 1.35;
  }
  .foot { text-align: center; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .foot a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <label for="model">Модель</label>
    <select id="model" aria-label="Модель калькулятора"></select>
  </div>

  <div class="calc">
    <div class="brand"><span>ЭЛЕКТРОНИКА</span><span id="modelName">Б3-34</span></div>

    <div class="screen">
      <div class="lcd" id="lcd">0</div>
      <div class="lcd-sub">
        <span>режим: <b id="stMode">АВТ</b></span>
        <span>слой: <b id="stLayer">—</b></span>
        <span>адрес: <b id="stStep">00</b></span>
      </div>
    </div>

    <div class="stack" id="stack"></div>
    <div class="regs" id="regs"></div>
    <div class="keys" id="keys"></div>

    <div class="service">
      <button type="button" id="btnStep">Шаг ▶</button>
      <button type="button" id="btnRun">Пуск ⏩</button>
      <button type="button" id="btnReset">⟲ Сброс</button>
    </div>

    <div class="hint" id="hint">Готово. Клавиша f открывает второй слой, k — слой косвенных команд.</div>
  </div>

  <div class="foot"><a href="tests.html">Проверка ядра — 12 эталонов</a></div>
</div>

<script src="core.js"></script>
<script src="profiles.js"></script>
<script src="ui.js"></script>
</body>
</html>
