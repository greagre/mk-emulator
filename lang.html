<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181b">
<title>МК-Алго — язык над ПМК</title>
<style>
  :root {
    --bg: #15181b; --panel: #1b1f23; --chip: #1f242a; --edge: #262c33;
    --line: #3d444b; --text: #e6e9ec; --muted: #9aa4ad; --accent: #6fb3ef;
    --accent-ink: #0d1418; --ok: #6fce8e; --bad: #ef8f8f; --num: #8a98a8;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1f6; --panel: #ffffff; --chip: #f4f6fa; --edge: #e3e8f0;
      --line: #d7dee8; --text: #17212b; --muted: #6b7a8c; --accent: #2f6feb;
      --accent-ink: #ffffff; --ok: #17864a; --bad: #c0392b; --num: #8a98a8;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: 12px 10px 24px; }
  .app { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px; margin-bottom: 10px; }
  .card h2 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  textarea {
    width: 100%; min-height: 230px; resize: vertical;
    background: var(--chip); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5; tab-size: 2;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button {
    background: var(--chip); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 14px;
    cursor: pointer;
  }
  button:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button:disabled { opacity: .5; }
  .params { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .pfield { background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
  .pfield span { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .pfield input {
    width: 100%; background: transparent; border: 0; color: var(--text);
    font-family: ui-monospace, Menlo, monospace; font-size: 15px; padding: 0; outline: none;
  }
  .err { color: var(--bad); font-size: 13px; font-family: ui-monospace, Menlo, monospace;
    white-space: pre-wrap; }
  .ok { color: var(--ok); font-size: 13px; }
  .listing { max-height: 300px; overflow: auto; font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; line-height: 1.55; }
  .listing div { display: flex; gap: 8px; white-space: pre; }
  .listing .a { color: var(--num); }
  .listing .c { color: var(--accent); min-width: 3ch; }
  .listing .n { color: var(--text); }
  .listing .stop .n { color: var(--ok); font-weight: 700; }
  .out { font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
  .out div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .out div:last-child { border-bottom: 0; }
  .out .lbl { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .out .val { color: var(--accent); font-weight: 700; font-size: 18px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }
  a.back { color: var(--accent); font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<div class="app">
  <h1>МК-Алго</h1>
  <div class="sub">Текст → коды ПМК → прогон на чистом ядре. Адреса считает компилятор.</div>

  <div class="card">
    <h2>Программа</h2>
    <textarea id="src" spellcheck="false">reg n f
param n = 7
f = 1
while n != 0
  f = f * n
  n = n - 1
end
print f
</textarea>
    <div class="row">
      <button class="primary" id="btnBuild">Собрать</button>
      <button id="btnRun">Пуск</button>
      <button id="btnDemo">Ещё пример</button>
    </div>
  </div>

  <div class="card">
    <h2>Параметры</h2>
    <div class="params" id="params"><span class="meta">появятся после сборки</span></div>
  </div>

  <div class="card">
    <h2>Сборка</h2>
    <div id="build"><span class="meta">нажми «Собрать»</span></div>
  </div>

  <div class="card">
    <h2>Вывод</h2>
    <div id="out" class="out"><span class="meta">нажми «Пуск»</span></div>
    <div class="meta" id="runmeta"></div>
  </div>

  <div class="card">
    <h2>Листинг</h2>
    <div class="listing" id="listing"><span class="meta">появится после сборки</span></div>
  </div>

  <a class="back" href="index.html">← к эмулятору</a>
</div>

<script src="core.js"></script>
<script src="lang.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var srcEl = $('src'), paramsEl = $('params'), buildEl = $('build');
  var outEl = $('out'), listEl = $('listing'), metaEl = $('runmeta');

  if (!window.MKCore || !window.MKLang) {
    buildEl.innerHTML = '<div class="err">не загрузились core.js или lang.js</div>';
    return;
  }

  var core = window.MKCore.create({ onEvent: function () {} });
  var built = null;

  var DEMOS = [
    'reg n f\nparam n = 7\nf = 1\nwhile n != 0\n  f = f * n\n  n = n - 1\nend\nprint f\n',
    'reg a b s\nparam a = 3\nparam b = 4\ns = a + b\nprint s\n',
    'reg a b c d\nparam a = 1\nparam b = 2\nparam c = 5\nparam d = 6\nif a > b\n  print a - b\nelse\n  print b * c + d\nend\n',
    'reg x s\nparam x = 5\ns = 0\nwhile x > 0\n  s = s + x * x\n  x = x - 1\nend\nprint s\n'
  ];
  var demoIdx = 0;

  function fmt(x) { return window.MKCore.fmtNum(x); }

  function build() {
    var res = window.MKLang.assemble(srcEl.value);
    built = res;
    outEl.innerHTML = '<span class="meta">нажми «Пуск»</span>';
    metaEl.textContent = '';
    if (!res.ok) {
      buildEl.innerHTML = '<div class="err">' + res.errors.map(esc).join('\n') + '</div>';
      paramsEl.innerHTML = '<span class="meta">нет параметров</span>';
      listEl.innerHTML = '<span class="meta">сборка не удалась</span>';
      return false;
    }
    buildEl.innerHTML = '<div class="ok">собрано: ' + res.size + ' шагов из ' +
      window.MKCore.PROG_LEN + '</div>';

    if (res.params.length) {
      paramsEl.innerHTML = res.params.map(function (p, i) {
        return '<label class="pfield"><span>' + esc(p.name) + '</span>' +
          '<input data-i="' + i + '" value="' + esc(String(p.value)) + '"></label>';
      }).join('');
    } else {
      paramsEl.innerHTML = '<span class="meta">параметров нет</span>';
    }

    listEl.innerHTML = res.listing.map(function (it) {
      var isStop = it.code === 0x50;
      return '<div' + (isStop ? ' class="stop"' : '') + '>' +
        '<span class="a">' + pad2(it.addr) + '</span>' +
        '<span class="c">' + hex(it.code) + '</span>' +
        '<span class="n">' + esc(it.name) + '</span></div>';
    }).join('');
    return true;
  }

  function run() {
    if (!built || !built.ok) { if (!build()) return; }
    if (!built || !built.ok) return;

    var values = [];
    var inputs = paramsEl.querySelectorAll('input');
    if (inputs.length !== built.params.length) { build(); inputs = paramsEl.querySelectorAll('input'); }
    for (var i = 0; i < inputs.length; i++) {
      var v = parseFloat(String(inputs[i].value).replace(',', '.'));
      values.push(isNaN(v) ? 0 : v);
    }

    core.reset(false);
    core.setProgram(built.codes, true);
    for (var j = 0; j < built.params.length; j++) {
      core.setRegister(built.params[j].reg, values[j]);
    }

    var outs = [], guard = 0, steps = 0, problem = '';

    while (guard++ < 60) {
      var r = core.run(60000);
      steps += r.steps;
      if (r.err) { problem = 'ЕГГОГ на адресе ' + pad2(core.ST.ip); break; }
      if (r.result === 'stop') {
        if (built.stops.indexOf(core.ST.ip) >= 0) {
          outs.push(r.x);
          /* Продолжаем только если дальше есть ещё один print.
             Иначе последний С/П, за которым одни К НОП, заворачивал бы
             прогон на адрес 00 и печатал одно и то же по кругу. */
          var more = false;
          for (var k = 0; k < built.stops.length; k++) {
            if (built.stops[k] > core.ST.ip) { more = true; break; }
          }
          if (!more) break;
          core.ST.ip = (core.ST.ip + 1) % window.MKCore.PROG_LEN;
          continue;
        }
        break;
      }
      if (r.overflow) { problem = 'остановлено по лимиту шагов'; break; }
      break;
    }

    if (!outs.length && !problem) problem = 'программа не дошла ни до одного print';

    outEl.innerHTML = outs.length
      ? outs.map(function (v, i) {
          return '<div><span class="lbl">вывод ' + (i + 1) + '</span>' +
                 '<span class="val">' + esc(fmt(v)) + '</span></div>';
        }).join('')
      : '<span class="meta">вывода нет</span>';

    metaEl.textContent = (problem ? problem + ' · ' : '') + 'шагов ' + steps;
    if (problem) metaEl.style.color = 'var(--bad)'; else metaEl.style.color = '';
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function hex(c) {
    var s = (c & 255).toString(16).toUpperCase();
    return s.length < 2 ? '0' + s : s;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  $('btnBuild').addEventListener('click', build);
  $('btnRun').addEventListener('click', run);
  $('btnDemo').addEventListener('click', function () {
    demoIdx = (demoIdx + 1) % DEMOS.length;
    srcEl.value = DEMOS[demoIdx];
    build();
  });

  build();
})();
</script>
</body>
</html>
